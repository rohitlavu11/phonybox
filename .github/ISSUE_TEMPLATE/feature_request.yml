name: Feature request
description: Something Phonybox should do that isn't a new provider.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The test or workflow, and where Phonybox gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
